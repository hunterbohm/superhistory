# Temporary, for #62: times the masking tests' inputs and candidate reference workloads on GitHub's runners. Removed
# before this PR is ready.
name: speed probe

on:
  pull_request:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
        sample: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: PROBE_REPS=3 python tools/speed_probe.py
