name: release

# A pushed tag v* tests the tag, builds the three assets that `releases/latest/download/<name>` serves, and creates the
# release with them. A pull request that touches the release or the installer builds the same assets and installs from
# them once, on ubuntu-latest only: the repo is private, so each runner minute is billed.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "install.sh"
      - "tools/release.sh"
      - "tools/release_scan.py"
      - "kb/_install.py"
      - "tests/test_release.py"

permissions:
  contents: read

jobs:
  build:
    # The pull request's check: the assets build, and install.sh installs from them in a throwaway HOME.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Release tests
        run: python -m unittest tests.test_release -v
      - name: Build and install from the assets
        run: |
          set -eu
          sh tools/release.sh "$RUNNER_TEMP/assets"
          export HOME="$RUNNER_TEMP/home"
          mkdir -p "$HOME"
          SUPERHISTORY_ARCHIVE_URL="file://$RUNNER_TEMP/assets/superhistory.tar.gz" sh "$RUNNER_TEMP/assets/install.sh"
          for command in "$HOME"/.local/bin/*; do "$command" --version; done

  test:
    # The tag's check: the whole suite, on the oldest and the newest Python the product supports.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -t .

  release:
    # Builds the assets from the tag, installs from them once, and creates the release. This step is what a tag gates.
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The tag names this version
        run: |
          set -eu
          version="$(python -c 'import kb; print(kb.__version__)')"
          [ "$GITHUB_REF_NAME" = "v$version" ] || { echo "tag $GITHUB_REF_NAME, but the code says $version" >&2; exit 1; }
      - name: Build and install from the assets
        run: |
          set -eu
          sh tools/release.sh "$RUNNER_TEMP/assets"
          export HOME="$RUNNER_TEMP/home"
          mkdir -p "$HOME"
          SUPERHISTORY_ARCHIVE_URL="file://$RUNNER_TEMP/assets/superhistory.tar.gz" sh "$RUNNER_TEMP/assets/install.sh"
          for command in "$HOME"/.local/bin/*; do "$command" --version; done
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME" \
            "$RUNNER_TEMP/assets/superhistory.tar.gz" "$RUNNER_TEMP/assets/SHA256SUMS" "$RUNNER_TEMP/assets/install.sh"
