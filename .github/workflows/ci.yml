# CI for a Python repo, from the land-pr skill's template: the same job names (changes, check, ci-ok),
# with check's steps for this repo. The repo is public, so GitHub-hosted runners cost nothing here.
# The template's test-quality and migrations jobs are left out: the first runs a Node script, and
# this repo has no SQL migrations.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 9 * * *"  # nightly full suite

concurrency:
  group: ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ github.event_name != 'pull_request' || steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: filter
        with:
          # A file counts as code unless it is documentation.
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!LICENSE*'

  check:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # The oldest Python the README supports, and a current one.
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      # The package needs nothing outside the standard library; installing it checks the packaging.
      - run: python -m pip install --quiet .
      - run: python -m unittest discover -s tests -t .

  ci-ok:
    if: always()
    needs: [changes, check]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # Passes when every job passed or was skipped by its filter; fails on failure or cancel.
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in success|skipped) ;; *) exit 1 ;; esac
          done
