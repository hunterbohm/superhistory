<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Superhistory</title>
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/app.css">
<script src="/static/app.js" defer></script>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="/" aria-label="Superhistory, overview"><img class="mark" src="/static/icon.svg" width="26" height="26" alt=""><span class="wordmark" id="wordmark" role="img" aria-label="Superhistory"></span></a>
    <form class="search" id="searchform" role="search">
      <svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" name="q" type="search" placeholder="Search your history" autocomplete="off" enterkeyhint="search" aria-label="Search your history">
      <kbd aria-hidden="true">/</kbd>
    </form>
    <a class="pill" id="pill" href="/#health"><span class="dot wait"></span><span id="pilltext">Checking</span></a>
    <button class="iconbtn" id="theme" type="button" aria-label="Switch theme">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </div>
  <nav class="wrap tabs" aria-label="Pages" id="tabs">
    <a href="/" data-tab="overview">Overview</a>
    <a href="/projects" data-tab="projects">Projects</a>
    <a href="/people" data-tab="people">People</a>
  </nav>
</header>
<main class="wrap" id="app" tabindex="-1"><div class="skel"></div></main>
<div id="tip" role="tooltip"></div>
<noscript><p class="wrap">The dashboard needs JavaScript, which it loads only from this computer.</p></noscript>
</body>
</html>
