[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
# The command is `kb`. PyPI's "kb" belongs to another project, so the distribution is named for the product.
name = "superhistory"
dynamic = ["version"]
description = "The knowledge base your agents check first."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = []

[project.scripts]
kb = "kb.cli:main"

[tool.setuptools.dynamic]
version = {attr = "kb.__version__"}

[tool.setuptools.packages.find]
include = ["kb*"]

[tool.setuptools.package-data]
"kb" = ["sample_month/*.jsonl"]
"kb._vendor.tomli" = ["LICENSE"]
