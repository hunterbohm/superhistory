[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
# The distribution name is open: PyPI's "varve" and "kb" belong to other projects.
name = "kb-knowledge-base"
dynamic = ["version"]
description = "The knowledge base your agents check first."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = []

[project.scripts]
kb = "kb.cli:main"

[tool.setuptools.dynamic]
version = {attr = "kb.__version__"}

[tool.setuptools.packages.find]
include = ["kb*"]

[tool.setuptools.package-data]
"kb" = ["sample_month/*.jsonl"]
"kb._vendor.tomli" = ["LICENSE"]
